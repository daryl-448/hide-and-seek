[project]
name = "hns"
version = "0.1.0"
description = "Replication of 'Hide and seek in transaction networks' (SISTS) on Elliptic++"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0",
    "torch-geometric==2.8.1",
    "polars>=1.0",
    "pyarrow>=17",
    "numpy>=2.0",
    "numba>=0.61",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = []
